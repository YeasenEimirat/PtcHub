<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة السر — PTC Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-wrap{max-width:420px;margin:60px auto;padding:0 20px}
        .reset-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
        .reset-card h2{color:var(--olive);font-family:var(--font-head);font-size:22px;margin:0 0 8px}
        .reset-card p{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.6}
        .reset-card label{display:block;font-family:var(--font-ar);font-size:13px;color:var(--muted);margin-bottom:6px}
        .reset-card input{width:100%;padding:12px 14px;border:1px solid var(--line-2,#d5d0c6);
            border-radius:10px;font-family:var(--font-ar);font-size:15px;background:var(--paper);
            color:var(--ink);margin-bottom:14px;box-sizing:border-box}
        .reset-card input:focus{outline:none;border-color:var(--copper)}
        .reset-card input.otp{text-align:center;font-size:24px;letter-spacing:8px;direction:ltr;font-family:var(--font-mono)}
        .reset-card .btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--olive);
            color:#fff;font-family:var(--font-ar);font-weight:700;font-size:15px;cursor:pointer}
        .reset-card .btn:hover{background:var(--olive-2,#5a6b47)}
        .reset-card .btn:disabled{opacity:.5;cursor:not-allowed}
        .reset-card .msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-family:var(--font-ar);font-size:13px;display:none}
        .reset-card .msg.ok{display:block;background:rgba(46,125,50,.1);color:#2e7d32}
        .reset-card .msg.err{display:block;background:rgba(192,57,43,.08);color:#c0392b}
        .step{display:none}
        .step.active{display:block}
        .back{display:block;text-align:center;margin-top:16px;font-family:var(--font-ar);font-size:13px}
        .back a{color:var(--olive);text-decoration:none}
    </style>
</head>
<body>
<div class="reset-wrap">
    <div class="reset-card">
        <h2>نسيت كلمة السر</h2>

        <div id="msgBox" class="msg"></div>

        <!-- الخطوة ١: إدخال البريد -->
        <div id="step1" class="step active">
            <p>اكتب بريدك الإلكتروني وبنبعتلك رمز تحقّق.</p>
            <label>البريد الإلكتروني</label>
            <input id="email" type="email" placeholder="you@gmail.com" dir="ltr" autocomplete="email">
            <button class="btn" id="btn1" onclick="requestOtp()">أرسل الرمز</button>
        </div>

        <!-- الخطوة ٢: إدخال الـ OTP -->
        <div id="step2" class="step">
            <p>أدخل الرمز اللي وصلك على بريدك.</p>
            <label>رمز التحقّق (٦ أرقام)</label>
            <input id="otp" class="otp" type="text" maxlength="6" placeholder="● ● ● ● ● ●"
                   inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
            <label>كلمة السر الجديدة</label>
            <input id="newPw" type="password" placeholder="٨ أحرف على الأقل" autocomplete="new-password">
            <button class="btn" id="btn2" onclick="resetPw()">تعيين كلمة السر</button>
            <div style="text-align:center;margin-top:10px">
                <a onclick="resend()" style="font-family:var(--font-ar);font-size:12.5px;
                   color:var(--olive);cursor:pointer">ما وصلني الرمز — أرسله مرة تانية</a>
            </div>
        </div>

        <!-- الخطوة ٣: نجاح -->
        <div id="step3" class="step">
            <p style="text-align:center;font-size:16px">✅</p>
            <p style="text-align:center">تم تعيين كلمة السر. سجّل دخولك.</p>
            <a href="login.html" class="btn" style="display:block;text-align:center;text-decoration:none">
                تسجيل الدخول
            </a>
        </div>

        <div class="back"><a href="login.html">← الرجوع لتسجيل الدخول</a></div>
    </div>
</div>

<script src="api-config.js"></script>
<script src="auth.js"></script>
<script>
    function msg(text, type) {
        var el = document.getElementById('msgBox');
        el.textContent = text;
        el.className = 'msg ' + (type || 'err');
    }

    function showStep(n) {
        document.querySelectorAll('.step').forEach(function (s) { s.classList.remove('active'); });
        document.getElementById('step' + n).classList.add('active');
    }

    async function requestOtp() {
        var email = document.getElementById('email').value.trim();
        if (!email) { msg('اكتب بريدك الإلكتروني.'); return; }

        var btn = document.getElementById('btn1');
        btn.disabled = true;
        msg('جارٍ الإرسال...', 'ok');

        try {
            await PTCAuth.forgotPassword(email);
            msg('لو البريد مسجّل، بيوصلك رمز تحقّق. تفقّد بريدك.', 'ok');
            showStep(2);
        } catch (e) {
            msg(e.message || 'حصل خطأ.');
        }
        btn.disabled = false;
    }

    async function resend() {
        msg('');
        await requestOtp();
    }

    async function resetPw() {
        var email = document.getElementById('email').value.trim();
        var otp = document.getElementById('otp').value.trim();
        var pw = document.getElementById('newPw').value;

        if (!otp || otp.length !== 6) { msg('الرمز لازم يكون ٦ أرقام.'); return; }
        if (!pw || pw.length < 8) { msg('كلمة السر لازم تكون ٨ أحرف على الأقل.'); return; }

        var btn = document.getElementById('btn2');
        btn.disabled = true;
        msg('جارٍ التحقّق...', 'ok');

        try {
            await PTCAuth.resetPassword(email, otp, pw);
            msg('تم تعيين كلمة السر بنجاح.', 'ok');
            showStep(3);
        } catch (e) {
            msg(e.message || 'الرمز غير صحيح أو منتهي.');
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
